plugins {
    id 'com.android.application'
}

android {
    namespace 'com.makstashkevich.tear'
    compileSdk 35 // обязательно с AGP 7+

    defaultConfig {
        applicationId "com.makstashkevich.tear"
        minSdk = 21
        targetSdk = 35
        versionCode 17
        versionName "1.2.7"
        versionNameSuffix " realise"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime:2.9.0"
    //noinspection LifecycleAnnotationProcessorWithJava8
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.9.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment:2.9.0"
    implementation "androidx.navigation:navigation-ui:2.9.0"

    // UI components
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.vectordrawable:vectordrawable:1.2.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"

    // Third-party libs
    //noinspection Aligned16KB
    implementation "pl.droidsonroids.gif:android-gif-drawable:1.2.27"

    // Local jars
    implementation files("libs/jsoup-1.11.3.jar")
    implementation files("libs/mint-android-sdk-5.2.4.jar")
    implementation files("libs/mint-gradle-android-plugin-5.2.4.jar")
    implementation files("libs/mint-android-instrumentation-5.2.4.jar")
}
