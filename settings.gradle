pluginManagement {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    plugins {
        id 'com.android.application' version '8.10.0' apply false
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "tear_app"
include(":tear_app")
