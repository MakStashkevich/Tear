plugins {
    id 'base'
}

tasks.register("cleanDot") {
    doLast {
        def osName = System.getProperty("os.name").toLowerCase()
        def dotCleanPath = '/usr/sbin/dot_clean'

        if (osName.contains("mac") && file(dotCleanPath).exists()) {
            println("Запускаем dot_clean...")
            exec {
                workingDir = rootProject.projectDir
                commandLine dotCleanPath, '.'
            }
            println("dot_clean выполнен в ${rootProject.projectDir}")
        } else {
            println("dot_clean не запущен: либо не macOS, либо отсутствует по пути ${dotCleanPath}")
        }
    }
}

tasks.register("cleanBuildDir", Exec) {
    workingDir = rootProject.projectDir
    def buildCleanPath = "${workingDir}/tear_app/build"
    commandLine 'rm', '-rf', buildCleanPath
    doLast {
        println("Папка ${buildCleanPath} удалена")
    }
}

tasks.named("clean") {
    dependsOn "cleanBuildDir"
    dependsOn "cleanDot"
    doLast {
        println("Clean завершён")
    }
}
